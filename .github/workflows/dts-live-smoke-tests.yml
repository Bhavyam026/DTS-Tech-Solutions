name: DTS Free Live Smoke Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check backend health
        run: |
          python - <<'PY'
          import json, urllib.request
          url = "https://dts-tech-solutions.onrender.com/health"
          with urllib.request.urlopen(url, timeout=30) as response:
              data = json.loads(response.read().decode())
              assert response.status == 200, f"health status={response.status}"
              assert data.get("status") == "ok", data
              print("Health check PASS:", json.dumps({
                  "status": data.get("status"),
                  "service": data.get("service"),
                  "provider": data.get("provider"),
                  "ai_configured": data.get("ai_configured"),
              }))
          PY

      - name: Check multi-product enquiry and safe UPS wiring answer
        run: |
          python - <<'PY'
          import json, urllib.request, uuid

          base = "https://dts-tech-solutions.onrender.com"
          session_id = "dts-" + str(uuid.uuid4())

          def post(message):
              body = json.dumps({
                  "session_id": session_id,
                  "messages": [{"role": "user", "content": message}]
              }).encode()
              req = urllib.request.Request(
                  base + "/api/chat", data=body,
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )
              for attempt in range(6):
        try:
            response_context = urllib.request.urlopen(req, timeout=30)
            break
        except urllib.error.HTTPError as error:
            if error.code not in (502, 503, 504) or attempt == 5:
                raise
            import time
            time.sleep(10)
    with response_context as response:
                  assert response.status == 200, f"chat status={response.status}"
                  return json.loads(response.read().decode())

          first = post("i want 5 ups and 3 electrical plane for plaghar loction")
          reply = first.get("reply", "")
          print("Multi-item response:", reply)
          assert "5 UPS" in reply or "5 ups" in reply.lower(), "UPS quantity 5 was not retained"
          assert "3 Electrical Panel" in reply or "3 electrical panel" in reply.lower(), "Electrical Panel quantity 3 was not retained"
          assert "Palghar" in reply, "Palghar location was not normalized"
          assert not first.get("whatsapp_draft_url"), "WhatsApp draft appeared before explicit confirmation"
          assert first.get("whatsapp_sent") is False, "WhatsApp must never be marked as sent"

          second = post("UPS ke liye wire kitne mm ki lagegi?")
          answer = second.get("reply", "")
          print("UPS wiring response:", answer)
          assert any(word in answer.lower() for word in ("cable size", "mm²", "ups ki wiring", "wire size")), "UPS wiring answer missing"
          assert any(word in answer.lower() for word in ("depend", "depends", "rating", "load", "model")), "Answer should explain sizing depends on technical details"
          assert not second.get("whatsapp_draft_url"), "WhatsApp draft appeared during a technical question"
          assert second.get("whatsapp_sent") is False, "WhatsApp must never be marked as sent"
          print("DTS live chat smoke tests PASS")
          PY

      - name: Check Network Rack category transition and TV feature follow-up
        run: |
          python - <<'PY'
          import json, urllib.request, uuid

          base = "https://dts-tech-solutions.onrender.com"

          def make_session():
              return "dts-" + str(uuid.uuid4())

          def post(session_id, message):
              body = json.dumps({
                  "session_id": session_id,
                  "messages": [{"role": "user", "content": message}]
              }).encode()
              req = urllib.request.Request(
                  base + "/api/chat", data=body,
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )
              for attempt in range(6):
        try:
            response_context = urllib.request.urlopen(req, timeout=30)
            break
        except urllib.error.HTTPError as error:
            if error.code not in (502, 503, 504) or attempt == 5:
                raise
            import time
            time.sleep(10)
    with response_context as response:
                  assert response.status == 200
                  data = json.loads(response.read().decode())
                  assert data.get("whatsapp_sent") is False, "WhatsApp must never be marked sent"
                  return data

          rack_session = make_session()
          firewall = post(rack_session, "firewall hai apke pass")
          assert "firewall" in firewall["reply"].lower(), firewall
          rack = post(rack_session, "networkrack chiye")
          assert "network rack" in rack["reply"].lower(), rack
          assert "u size" in rack["reply"].lower(), rack
          assert "Namaste! Main DTS AI Assistant hoon. Aapko kis cheez ki requirement hai" not in rack["reply"]
          for message in ("12U", "2 racks", "Palghar MIDC", "7826349150"):
              rack = post(rack_session, message)
              assert not rack.get("whatsapp_draft_url"), "Draft must wait for explicit summary confirmation"
          assert rack["state"] == "SUMMARY_READY", rack
          assert "Network Rack (12U)" in rack["pending_summary"], rack
          assert "2 Network Rack" in rack["pending_summary"], rack
          assert "Palghar MIDC" in rack["pending_summary"], rack

          tv_session = make_session()
          post(tv_session, "TV hai ky ??")
          post(tv_session, "50 ich ka chiye")
          post(tv_session, "2")
          post(tv_session, "palghar MIDC mai")
          tv = post(tv_session, "Tv ke andar ky ky milega ??")
          answer = tv["reply"].lower()
          assert "exact model par depend karta hai" in answer, tv
          assert "50-inch" in tv["reply"], tv
          assert "2 tv" in answer, tv
          assert "palghar" in answer, tv
          assert "mobile number" in answer, tv
          assert "kitne tv chahiye" not in answer, tv
          assert not tv.get("whatsapp_draft_url"), "TV feature question must not create a draft"
          print("Network Rack transition and TV feature follow-up live tests PASS")
          PY


      - name: Check Hinglish typos, educational priority, and context preservation
        run: |
          python - <<'PY'
          import json, urllib.request, uuid

          base = "https://dts-tech-solutions.onrender.com"

          def make_session():
              return "dts-" + str(uuid.uuid4())

          def post(session_id, message):
              body = json.dumps({
                  "session_id": session_id,
                  "messages": [{"role": "user", "content": message}]
              }).encode()
              req = urllib.request.Request(
                  base + "/api/chat", data=body,
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )
              for attempt in range(6):
        try:
            response_context = urllib.request.urlopen(req, timeout=30)
            break
        except urllib.error.HTTPError as error:
            if error.code not in (502, 503, 504) or attempt == 5:
                raise
            import time
            time.sleep(10)
    with response_context as response:
                  assert response.status == 200
                  data = json.loads(response.read().decode())
                  assert data.get("whatsapp_sent") is False
                  return data

          desktop_session = make_session()
          desktop = post(desktop_session, "desktop mai ky ky hota hai")
          assert "processor" in desktop["reply"].lower(), desktop
          assert "ram" in desktop["reply"].lower(), desktop
          assert "kitni quantity" not in desktop["reply"].lower(), desktop

          typo_desktop = post(make_session(), "desk top mai ky ky hota hai")
          assert "processor" in typo_desktop["reply"].lower(), typo_desktop
          assert "ram" in typo_desktop["reply"].lower(), typo_desktop

          access = post(make_session(), "acess contraol hai")
          assert "access-control" in access["reply"].lower(), access
          assert "attendance" in access["reply"].lower(), access
          assert "kitni quantity" not in access["reply"].lower(), access

          access_typo = post(make_session(), "access controll hai")
          assert "access-control" in access_typo["reply"].lower(), access_typo

          fire_typo = post(make_session(), "fire alaram hai")
          assert "fire" in fire_typo["reply"].lower(), fire_typo

          pen_session = make_session()
          pen = post(pen_session, "pen driver hai?")
          assert "pen drive" in pen["reply"].lower(), pen
          capacity = post(pen_session, "64 ka")
          assert "64 gb pen drive" in capacity["reply"].lower(), capacity
          assert "kitni pen drives" in capacity["reply"].lower(), capacity

          location_session = make_session()
          post(location_session, "fire alarm chahiye")
          post(location_session, "smoke detector")
          quantity = post(location_session, "5")
          assert "quantity hai ya" not in quantity["reply"].lower(), quantity
          location = post(location_session, "loctaion pe chiye")
          assert "city" in location["reply"].lower() or "area" in location["reply"].lower(), location
          assert location["state"] == "GATHERING", location
          assert not location.get("whatsapp_draft_url"), location
          print("Hinglish normalization and context smoke tests PASS")
          PY

      - name: Verify pen-drive to HDD context switch on live backend
        run: |
          python - <<'PY'
          import json, urllib.request, uuid
          base = "https://dts-tech-solutions.onrender.com"
          sid = "dts-" + str(uuid.uuid4())
          def post(message):
              payload = json.dumps({"session_id": sid, "messages": [{"role": "user", "content": message}]}).encode()
              req = urllib.request.Request(base + "/api/chat", data=payload, headers={"Content-Type": "application/json"}, method="POST")
              for attempt in range(6):
        try:
            response_context = urllib.request.urlopen(req, timeout=30)
            break
        except urllib.error.HTTPError as error:
            if error.code not in (502, 503, 504) or attempt == 5:
                raise
            import time
            time.sleep(10)
    with response_context as response:
                  assert response.status == 200
                  return json.loads(response.read().decode())
          pen = post("pen drive hai")
          assert "pen drive" in pen.get("reply", "").lower(), pen
          hdd = post("hdd bhi chiye")
          reply = hdd.get("reply", "").lower()
          print("HDD response:", hdd.get("reply"))
          assert "hdd" in reply or "hard disk" in reply, hdd
          assert "internal" in reply or "external" in reply, hdd
          assert "kitni pen drives" not in reply, hdd
          assert not hdd.get("whatsapp_draft_url"), hdd
          assert hdd.get("whatsapp_sent") is False, hdd
          print("Live pen-drive to HDD context-switch test PASS")
          PY
